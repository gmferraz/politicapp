name: pipeline

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      ano:
        description: "Ano de referência"
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Gerar dados
        env:
          PIPELINE_ANO: ${{ inputs.ano }}
          PIPELINE_CONCORRENCIA: "3"
          PORTAL_TRANSPARENCIA_API_KEY: ${{ secrets.PORTAL_TRANSPARENCIA_API_KEY }}
        run: pnpm -C packages/pipeline start

      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/pipeline/dist

  publicar:
    needs: gerar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
